services:
  api:
    build:
      context: .
      dockerfile: backend/MyAssistant.API/Dockerfile
    container_name: myassistant-api
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: Data Source=/app/data/myassistant.db
      Jwt__Secret: ${JWT_SECRET:-change_me_in_production_please_use_a_long_random_string}
      Jwt__Issuer: MyAssistant
      Jwt__Audience: MyAssistantClient
      AI__Provider: ${AI_PROVIDER:-local}
      AI__ApiKey: ${AI_API_KEY:-}
      AI__Model: ${AI_MODEL:-gpt-4o-mini}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"
    volumes:
      - app_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: myassistant-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  app_data:
