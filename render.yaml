# Render Blueprint — MyAssistant
# https://render.com/docs/blueprint-spec

services:
  # ── Backend API (Docker) ──────────────────────────────────────────────
  - type: web
    name: myassistant-api
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: MyAssistant
      - key: Jwt__Audience
        value: MyAssistantClient
      - key: Cors__AllowedOrigins
        value: '["https://myassistant-frontend.onrender.com"]'
      - key: Email__FrontendUrl
        value: https://myassistant-frontend.onrender.com
      - key: AI__Provider
        value: local
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"

  # ── Frontend (Static Site) ────────────────────────────────────────────
  - type: static_site
    name: myassistant-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://myassistant-api.onrender.com/api
